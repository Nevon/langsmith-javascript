name: Check PR source

# Production main only takes the Copybara export pull request and the
# release-please pull request (including per-component release branches).
# Urgent fix: add the `skip-pr-source-check` label, then make the same change
# in sdks/javascript in langchainplus so the next export does not revert it.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  check:
    name: PR comes from staging
    if: github.repository == 'langchain-ai/langsmith-javascript'
    runs-on: ubuntu-latest
    steps:
      - name: Check the head branch
        env:
          HEAD: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-pr-source-check') }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "::warning::skip-pr-source-check label present. After merging, make the same change in sdks/javascript in langchainplus so the next export does not revert it."
            exit 0
          fi
          if [ "$SAME_REPO" = "true" ]; then
            case "$HEAD" in
              copybara/export-javascript|release-please--branches--main|release-please--branches--main--components--*) exit 0 ;;
            esac
          fi
          echo "::error::PRs to main must come from copybara/export-javascript. Open the change in sdks/javascript in langchainplus, or add the skip-pr-source-check label for an urgent production fix."
          exit 1
